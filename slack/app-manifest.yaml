# Create the Slack app from this manifest: https://api.slack.com/apps -> Create New App -> From a manifest.
# Replace request_url with the SlackEventsRequestUrl output of the SAM stack.
display_information:
  name: Knowledge Assistant
  description: Answers questions from company documents using Amazon Bedrock (RAG).
  background_color: "#1d2b3a"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Knowledge Assistant
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read # receive @mentions in channels
      - chat:write        # post answers
      - im:history        # receive direct messages to the bot
settings:
  event_subscriptions:
    request_url: https://<api-id>.execute-api.<region>.amazonaws.com/prod/slack/events
    bot_events:
      - app_mention
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
